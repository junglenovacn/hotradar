name: 每日热点抓取与部署

# 热点雷达：每天自动抓取六大热榜 → 重建静态站 → 部署 GitHub Pages → 回写数据快照
on:
  schedule:
    # 北京时间每天早上 06:00（UTC 前一天 22:00）
    - cron: "0 22 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write # 回写 data/ 数据快照
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖（仅 Pillow，用于生成 OG 分享图）
        run: pip install pillow

      - name: 抓取六大热榜数据源
        run: python src/fetch.py

      - name: 生成静态站点
        run: python src/build.py

      - name: 清理旧数据快照（仅保留最近 30 天）
        run: |
          cd data
          count=$(ls -1 *.json 2>/dev/null | wc -l)
          if [ "$count" -gt 30 ]; then
            ls -1 *.json | sort | head -n $((count - 30)) | xargs rm
          fi

      - name: 回写数据快照到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): 每日热榜快照 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
